name: Bug report
description: Report a reproducible problem in Usage Desk.
body:
  - type: markdown
    attributes:
      value: "Remove real emails, tokens, account files, and sign-in URLs. Report security problems privately using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and architecture
      placeholder: macOS version; app version; Apple silicon or Intel; Codex CLI version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or diagnostics
      description: Do not upload auth.json, accounts.json, your Codex home, or raw login links.
