name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Source-installer checks inspect the pinned ancestor commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Version and source-release checks
        run: |
          node scripts/version.mjs --check
          node scripts/check-release.mjs
      - name: Native tests (synthetic data; live tests skipped)
        run: swift test --scratch-path .build --cache-path .cache
      - name: Build application
        run: zsh scripts/build.sh
      - name: Verify website and public files
        run: node scripts/check-website.mjs
      - name: Verify app signature
        run: codesign --verify --strict "dist/Usage desk.app"
